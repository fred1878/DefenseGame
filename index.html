<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>DefenseGame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0f1014;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #loading-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        background: #0f1014;
        color: rgba(255, 255, 255, 0.55);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px;
        letter-spacing: 0.04em;
        z-index: 1;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <p id="loading-splash" aria-live="polite">Loading…</p>
    <div id="game"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
