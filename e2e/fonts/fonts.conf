<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Pinned fonts for e2e/visual-screens.spec.ts only (FONTCONFIG_FILE is set for that
  spec's browser). The game's UI font stack starts with `system-ui`, which resolves
  to different fonts on different Linux machines, so screenshots taken locally and on
  CI would never match. Every family here resolves to the bundled DejaVu Sans.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/defensegame-e2e-fontconfig-cache</cachedir>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
