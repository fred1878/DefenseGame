name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Upload GitHub Pages payload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Zip web bundle for GitHub Release (optional download)
        run: |
          cd dist
          zip -r "../defensegame-web-${{ github.ref_name }}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: defensegame-web-${{ github.ref_name }}.zip
          generate_release_notes: true