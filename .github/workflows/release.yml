name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Zip web bundle
        run: |
          cd dist
          zip -r "../defensegame-web-${{ github.ref_name }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/
            defensegame-web-${{ github.ref_name }}.zip

  github_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/defensegame-web-${{ github.ref_name }}.zip
          generate_release_notes: true

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: site/
      - name: Prepare Pages root
        run: |
          rm -f site/defensegame-web-*.zip
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4