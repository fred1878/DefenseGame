name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # PRs: one active run per PR; superseded pushes cancel. Main: let each push finish
  # (rapid merges should not kill an in-flight e2e).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-gate:
    runs-on: ubuntu-24.04
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            runtime:
              - 'src/**'
              - 'e2e/**'
              - 'public/**'
              - 'scripts/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'vitest.config.*'
              - '.nvmrc'
            workflow:
              - '.github/workflows/**'
      - name: Decide whether to run Playwright e2e
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_RUNTIME: ${{ steps.paths.outputs.runtime }}
          PATHS_WORKFLOW: ${{ steps.paths.outputs.workflow }}
        run: |
          set -euo pipefail
          run=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PRs: always gate with e2e unless the diff is docs/metadata-only.
            if [ "$PATHS_RUNTIME" = "true" ] || [ "$PATHS_WORKFLOW" = "true" ]; then
              run=true
            fi
          else
            # Push to main: verify always runs; e2e only for runtime/workflow paths or a heavy merge signal.
            if [ "$PATHS_RUNTIME" = "true" ] || [ "$PATHS_WORKFLOW" = "true" ]; then
              run=true
            else
              parent_count=$(git rev-list --parents -1 HEAD | awk '{print NF - 1}')
              if [ "$parent_count" -ge 2 ]; then
                msg=$(git log -1 --format=%B)
                if printf '%s' "$msg" | grep -qiE '(^|\\b)(conflict|conflicts|resolve conflicts|merge conflict)'; then
                  run=true
                else
                  merge_files=$(git diff --name-only HEAD^1 HEAD^2 | wc -l | tr -d ' ')
                  if [ "${merge_files:-0}" -ge 20 ]; then
                    run=true
                  fi
                fi
              fi
            fi
          fi

          echo "run_e2e=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "Playwright e2e: enabled for this event."
          else
            echo "Playwright e2e: skipped (no runtime/workflow paths; no heavy merge signal on main)."
          fi

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14
      - name: Production build
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

  e2e:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: E2E production build
        run: npm run build
        env:
          VITE_E2E: "true"
          VITE_BUILD_ID: e2e-ci
          VITE_BASE: /
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7