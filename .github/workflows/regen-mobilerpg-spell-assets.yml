name: Regen MobileRPG spell assets

# Manual: re-slice spell icons/FX after fetching a pristine atlas.tga blob.
# Requires MOBILERPG_GITHUB_TOKEN, CROSS_REPO, or CARDGAME_DEBUG_GITHUB_PAT (MobileRPG read).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Fetch MobileRPG atlas (Git blob API)
        env:
          MOBILERPG_GITHUB_TOKEN: ${{ secrets.MOBILERPG_GITHUB_TOKEN || secrets.CROSS_REPO || secrets.CARDGAME_DEBUG_GITHUB_PAT }}
        run: |
          python3 scripts/fetch-mobilerpg-atlas-blob.py
      - name: Extract spell PNGs
        env:
          MOBILERPG_ATLAS_TGA: /tmp/mobilerpg-assets/atlas.tga
        run: python3 scripts/extract-mobilerpg-spell-assets.py
      - name: Upload spell asset artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobilerpg-spell-pngs
          path: |
            public/assets/spells/icons
            public/assets/spells/fx
          retention-days: 7